<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Muay Thai Moe Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout v1.3: night-ring pixel console — sticky HUD with top tab bar on every screen size, compact cards, half-body VN portraits; VN, montage and fight as full-screen layers */
:root{
  --bg:#141020; --bg2:#1c1730; --surface:#241d3a; --raise:#2f2750; --line:#4a3f72; --edge:#0b0814; --fg:#f5f0fa; --muted:#b2a8c8; --dim:#857aa3;
  --red:#e23b4e; --red-d:#9e1f32; --gold:#f2c14e; --gold-d:#a77b1c; --green:#4cc38a; --warn:#f0a03a; --blue:#5b8de8; --purple:#9b62e0;
  --f-pixel:"Pixelify Sans","Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif; --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --notch:polygon(0 6px,3px 6px,3px 3px,6px 3px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px));
  --nav-h:0px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:8px 8px}
#app{min-height:100%}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible,[role="button"]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance}
.muted{color:var(--muted)}.dim{color:var(--dim)}.pos{color:var(--green)}.neg{color:#ff7b8a}.goldt{color:var(--gold)}
.meta{font-size:13px;color:var(--muted)}
.lead{font-size:14px;color:var(--muted);margin:0}
.center{display:flex;justify-content:center}

/* ---------- pixel primitives ---------- */
.px{position:relative;background:var(--surface);clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--line),inset 6px 6px 0 rgba(255,255,255,.04),inset -6px -6px 0 rgba(0,0,0,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:0;cursor:pointer;font-weight:700;font-family:var(--f-display);letter-spacing:.02em;
  background:var(--raise);clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--line),inset 3px 3px 0 rgba(255,255,255,.12),inset -3px -5px 0 rgba(0,0,0,.35);transition:transform .06s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 3px var(--line),inset 3px 3px 0 rgba(0,0,0,.3)}
.btn.primary{background:var(--red);color:#fff;box-shadow:inset 0 0 0 3px var(--red-d),inset 3px 3px 0 rgba(255,255,255,.25),inset -3px -5px 0 rgba(0,0,0,.3)}
.btn.gold{background:var(--gold);color:#2a1b02;box-shadow:inset 0 0 0 3px var(--gold-d),inset 3px 3px 0 rgba(255,255,255,.35),inset -3px -5px 0 rgba(0,0,0,.2)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.btn.sm{padding:6px 11px;font-size:13px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border:0;background:var(--raise);clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--line);cursor:pointer;flex:none}
.ic{width:20px;height:20px;fill:currentColor;stroke:currentColor;stroke-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:12px;font-weight:700;background:var(--raise);box-shadow:inset 0 0 0 2px var(--line);white-space:nowrap;font-family:var(--f-display)}
.pill.red{background:rgba(226,59,78,.22);box-shadow:inset 0 0 0 2px rgba(226,59,78,.6);color:#ff9aa5}
.pill.gold{background:rgba(242,193,78,.16);box-shadow:inset 0 0 0 2px rgba(242,193,78,.55);color:var(--gold)}
.pill.green{background:rgba(76,195,138,.16);box-shadow:inset 0 0 0 2px rgba(76,195,138,.5);color:var(--green)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border:0;background:var(--bg2);cursor:pointer;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 2px var(--line)}
.seg button[aria-pressed="true"]{background:var(--red);box-shadow:inset 0 0 0 2px var(--red-d);color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:7px}
.sw button{width:30px;height:30px;border:0;cursor:pointer;box-shadow:inset 0 0 0 3px rgba(0,0,0,.35)}
.sw button[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}

/* ---------- title / creator ---------- */
.version{position:absolute;right:14px;bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:1;font-size:12px;color:var(--dim)}
.creator{min-height:100dvh;padding:20px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 50% 0%,#3a2a63,transparent 60%)}
.cr-in{max-width:980px;margin:0 auto;display:grid;gap:16px}
.cr-head h1{font-family:var(--f-display);font-size:clamp(22px,4vw,30px)}
.cr-grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px}
@media (max-width:720px){.cr-grid{grid-template-columns:1fr}}
.cr-preview{padding:16px;display:grid;gap:12px;justify-items:center;align-content:start}
.cr-stage{width:100%;display:grid;place-items:center;background:url(a/bg_camp.webp) center 70%/cover;padding:10px;box-shadow:inset 0 0 0 3px var(--line)}
.cr-stage canvas{width:180px;height:240px;image-rendering:pixelated}
@media (max-width:720px){.cr-stage canvas{width:132px;height:176px}}
.cr-opts{padding:16px;display:grid;gap:14px}
.field{display:grid;gap:6px;width:100%}
.field label,.lb{font-weight:700;font-size:14px}
.field input[type=text],.field input:not([type]){font:inherit;width:100%;padding:10px 12px;border:0;background:var(--bg2);color:var(--fg);box-shadow:inset 0 0 0 3px var(--line)}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.cr-foot{display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:0;padding:12px 0 max(4px,env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}

/* ---------- HUD & nav ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(20,16,32,.95);backdrop-filter:blur(6px);box-shadow:0 3px 0 var(--edge)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.hud-in{max-width:1180px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-pixel);font-weight:700;letter-spacing:.06em;font-size:16px;white-space:nowrap}
.brand b{color:var(--red)}
.wk{display:flex;flex-direction:column;line-height:1.15}
.wk strong{font-family:var(--f-display);font-size:18px}.wk strong small{font-size:12px;color:var(--dim)}
.wk span{font-size:12px;color:var(--gold)}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat span{font-size:11px;color:var(--muted)}
.stat b{font-family:var(--f-pixel);font-size:16px}
.tabs{max-width:1180px;margin:0 auto;display:flex;gap:2px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center;position:relative;border-bottom:3px solid transparent;font-family:var(--f-display)}
.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--red)}
.tabs .dot{position:absolute;top:6px;right:4px;width:7px;height:7px;background:var(--gold)}
main{max-width:1180px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.card{padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.card h3{font-size:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec{font-size:18px;margin-top:6px}
/* ---------- home ---------- */
.camp-wrap{padding:6px;display:grid;gap:8px}
.campcv{width:100%;height:auto;aspect-ratio:16/9;display:block;image-rendering:pixelated;background:#2a2150}
.camp-info{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:4px 8px 8px}
.advisor .adv-head,.adv-head{display:flex;gap:12px;align-items:center}
.chibi{width:56px;height:75px;image-rendering:pixelated;flex:none;background:var(--bg2);box-shadow:inset 0 0 0 2px var(--line)}
.tips{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tips li{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bg2);padding:9px 11px;box-shadow:inset 3px 0 0 var(--gold);font-size:14px}
.tips li span{flex:1 1 200px}
.rin-tip{display:flex;gap:10px;align-items:center;background:rgba(76,195,138,.08);box-shadow:inset 3px 0 0 var(--green);padding:8px 10px}
.rin-tip img{width:44px;height:44px;object-fit:cover;flex:none}
.rin-tip p{margin:0;font-size:14px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:8px}
.actbtn{text-align:left;padding:10px 12px;border:0;background:var(--bg2);cursor:pointer;box-shadow:inset 0 0 0 2px var(--line),inset 0 -4px 0 rgba(0,0,0,.3);display:grid;gap:2px}
.actbtn b{font-size:14px;font-family:var(--f-display)}.actbtn small{font-size:12px;color:var(--muted)}
.actbtn:hover:not([disabled]){box-shadow:inset 0 0 0 2px var(--gold),inset 0 -4px 0 rgba(0,0,0,.3)}
.actbtn[disabled]{opacity:.45;cursor:not-allowed}
.fc{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;cursor:pointer}
.face{width:64px;height:64px;object-fit:cover;background:var(--bg2);box-shadow:inset 0 0 0 3px var(--c,var(--line));display:block;image-rendering:auto}
.face.sm{width:40px;height:40px}
canvas.face{image-rendering:auto}
.nm{font-family:var(--f-display);font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:76px minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bar i{display:block;height:9px;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--edge);position:relative}
.bar i::after{content:"";position:absolute;inset:2px auto 2px 2px;width:calc(var(--v) - 4px);max-width:calc(100% - 4px);background:var(--bc,var(--green))}
.bar b{font-weight:700;color:var(--fg);text-align:right;font-family:var(--f-pixel)}
.xp{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;min-width:0}.xp .pill{flex:none}
.xp .lv{font-family:var(--f-pixel);color:var(--gold);font-weight:700}
.xp i{flex:1 1 90px;height:8px;background:var(--bg2);position:relative;box-shadow:inset 0 0 0 1px var(--edge);min-width:70px}
.xp i::after{content:"";position:absolute;inset:2px auto 2px 2px;width:calc(var(--v) - 4px);background:linear-gradient(90deg,var(--purple),var(--blue))}
.hearts{color:var(--red);letter-spacing:1px;font-size:14px}.hearts .off{color:var(--line)}

/* lists/tables */
.list{display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bg2);padding:10px 12px;box-shadow:inset 0 0 0 2px var(--line)}
.item .l{display:flex;gap:10px;align-items:center;min-width:0}
.item .t{font-weight:700}
.kv-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0;border-bottom:2px dotted rgba(74,63,114,.6)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px;border-bottom:3px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid rgba(74,63,114,.6)}
tr.me td{background:rgba(226,59,78,.12)}tr.rival td{background:rgba(155,98,224,.1)}tr.cut td{border-bottom:3px dashed var(--gold)}
.form{display:inline-flex;gap:2px}
.form i{width:16px;height:16px;font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center;color:#111}
.form .W{background:var(--green)}.form .L{background:var(--red);color:#fff}.form .D{background:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:4px 0}

/* training */
.trcard{grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px}
@media (max-width:760px){.trcard{grid-template-columns:1fr}}
.tr-left{display:grid;gap:8px;justify-items:center}
.tr-stage{position:relative;width:100%;max-width:260px;aspect-ratio:1;background:url(a/bg_camp.webp) 62% 80%/360% auto;box-shadow:inset 0 0 0 3px var(--line)}
.tr-stage canvas{width:100%;height:100%;display:block}
.tr-tag{position:absolute;left:8px;top:8px;background:rgba(20,16,32,.85);padding:2px 8px;font-size:12px;font-weight:700;box-shadow:inset 0 0 0 2px var(--gold);color:var(--gold)}
.tr-right{display:grid;gap:12px;align-content:start;min-width:0}
.proj{font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:6px}
.presets button{text-align:left;padding:8px 10px;border:0;background:var(--bg2);cursor:pointer;font-size:13px;font-weight:700;box-shadow:inset 0 0 0 2px var(--line);font-family:var(--f-display)}
.presets button small{display:block;font-weight:400;color:var(--dim);font-size:11px;line-height:1.35;margin-top:2px;font-family:var(--f-body)}
.presets button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--gold);background:rgba(242,193,78,.12)}
.attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:4px 18px;margin-top:6px}
.attrs h4{grid-column:1/-1;margin:6px 0 0;font-size:11px;letter-spacing:.08em;color:var(--dim)}
.attr{display:grid;grid-template-columns:70px minmax(0,1fr) 56px;gap:8px;align-items:center;font-size:13px}
.attr i{height:7px;background:var(--bg2);position:relative}
.attr i::after{content:"";position:absolute;inset:0;width:var(--v);background:linear-gradient(90deg,var(--blue),var(--purple))}
.attr b{text-align:right;font-family:var(--f-pixel)}.attr .up{color:var(--green);font-size:11px;margin-left:3px}
.radar{width:100%;max-width:240px;height:auto;overflow:visible}
.radar .rgrid{fill:none;stroke:var(--line);stroke-width:1}
.radar .rpot{fill:none;stroke:var(--dim);stroke-dasharray:3 3}
.radar .rshape{filter:drop-shadow(0 0 6px rgba(255,255,255,.25))}
.radar .rl{fill:var(--muted);font-size:11px;font-family:var(--f-display)}
.radar .rv{fill:var(--fg);font-size:11px;font-weight:700;font-family:var(--f-pixel)}

/* people */
.dates{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.dcard{position:relative;overflow:hidden;border:0;cursor:pointer;background:linear-gradient(180deg,#3a2a63,#1c1730);padding:0;text-align:left;clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--line)}
.dcard img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center 4%;display:block}
.dcard .cap{position:absolute;inset:auto 0 0 0;padding:26px 10px 8px;background:linear-gradient(transparent,rgba(15,11,24,.96));display:grid;gap:1px}
.dcard .cap b{font-family:var(--f-display);font-size:17px}
.dcard[aria-pressed="true"]{box-shadow:inset 0 0 0 4px var(--gold)}
.dcard[disabled]{opacity:.5;cursor:not-allowed}
.pcard{grid-template-columns:110px minmax(0,1fr);align-items:center;cursor:pointer}
.pc-img{width:110px;height:150px;object-fit:cover;object-position:center 0;background:linear-gradient(180deg,#3a2a63,#1c1730)}
.pc-info{display:grid;gap:4px}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,6,14,.78);display:grid;place-items:center;padding:12px max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{padding:20px;width:min(760px,100%);display:grid;gap:14px;max-height:calc(100dvh - 24px);overflow-y:auto}
.modal.m-profile{width:min(1000px,100%)}
.modal h2{font-size:22px}
.xbtn{position:absolute;right:10px;top:8px;border:0;background:none;cursor:pointer;font-size:18px;color:var(--muted);padding:6px;z-index:2}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.log{font-size:13px;color:var(--muted);max-height:180px;overflow-y:auto;display:grid;gap:3px;background:var(--bg2);padding:10px}
.lvup{font-family:var(--f-pixel);color:var(--gold);font-size:34px;text-align:center;animation:pop .5s}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.pfwrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px}
@media (max-width:720px){.pfwrap{grid-template-columns:1fr}}
.pf-art{display:grid;gap:8px;justify-items:center;align-content:start;background:radial-gradient(ellipse at 50% 40%,#4a3480,#1c1730 70%);padding:10px;position:sticky;top:0}
@media (max-width:720px){.pf-art{position:static}}
.pf-art img{width:100%;max-height:60dvh;object-fit:contain}
.pf-body{display:grid;gap:12px;min-width:0}
.pf-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.pf-cols h4{font-size:13px;color:var(--gold);margin:10px 0 6px;letter-spacing:.04em}
.info{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.info>div{background:var(--bg2);padding:6px 8px;display:grid;gap:1px}
.info>div.w{grid-column:1/-1}
.info span{font-size:11px;color:var(--dim)}.info b{font-size:14px;font-weight:600}
.lock{color:var(--dim);font-weight:400;font-style:italic}
.likes{margin:0;padding-left:18px;display:grid;gap:2px;font-size:14px}
.story{margin:0;font-size:14px;line-height:1.7}
.skills{display:grid;gap:8px}
.skill{display:flex;gap:10px;justify-content:space-between;align-items:center;background:var(--bg2);padding:8px 10px;box-shadow:inset 0 0 0 2px var(--line)}
.pips{display:inline-flex;gap:3px;vertical-align:middle}.pips i{width:10px;height:10px;background:var(--line)}.pips i.on{background:var(--gold)}
.vsrow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.vsc{display:grid;gap:4px;justify-items:center}
.vs{font-family:var(--f-pixel);font-size:28px;color:var(--gold)}
.planbars{display:grid;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--gold);color:#2a1b02;padding:10px 16px;font-weight:700;clip-path:var(--notch);max-width:calc(100% - 32px);animation:pop .3s}

/* montage */
.montage{position:fixed;inset:0;z-index:55;display:grid;place-items:center;overflow-y:auto}
.mt-bg{position:absolute;inset:0;background-size:cover;background-position:center 70%;filter:brightness(.55)}
.mt-in{position:relative;display:grid;gap:14px;justify-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));width:100%;max-width:980px}
.mt-in h2{font-family:var(--f-pixel);font-size:clamp(22px,4vw,32px);text-shadow:3px 3px 0 #000}

/* ---------- fight ---------- */
.fight{position:fixed;inset:0;z-index:55;background:radial-gradient(ellipse at 50% -20%,rgba(255,255,255,.14),transparent 45%),linear-gradient(180deg,#221b3d,#0f0c17 70%);overflow-y:auto}

.fhead{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}

.caption{padding:14px 16px;font-size:clamp(17px,2.6vw,21px);font-weight:700;line-height:1.5;min-height:4.4em;display:flex;align-items:center;font-family:var(--f-display);animation:cap .25s}

.plans button{text-align:left;padding:10px 12px;border:0;background:var(--bg2);cursor:pointer;font-weight:700;box-shadow:inset 0 0 0 2px var(--line);font-family:var(--f-display)}
.plans button small{display:block;font-weight:400;font-size:12px;color:var(--muted);font-family:var(--f-body)}
.plans button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--gold);background:rgba(242,193,78,.12)}
.corner{padding:14px;display:grid;gap:10px;box-shadow:inset 0 0 0 3px var(--gold)}

.corner .opts button{text-align:left;padding:10px 12px;border:0;background:var(--bg2);cursor:pointer;font-weight:700;box-shadow:inset 0 0 0 2px var(--line);font-family:var(--f-display)}
.corner .opts button small{display:block;font-weight:400;font-size:12px;color:var(--muted);font-family:var(--f-body)}

.result{text-align:center;display:grid;gap:8px;padding:18px}

.result .win{color:var(--gold);text-shadow:3px 3px 0 #6a4a0a}.result .lose{color:#ff8a97;text-shadow:3px 3px 0 #5a0f1a}

.statgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 14px;font-size:14px;max-width:420px;margin:0 auto;width:100%}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* =================== v1.3 =================== */
/* title v1.3.2: separate desktop / mobile key art + floating logo */
.title{position:fixed;inset:0;overflow:hidden;background:#1a1030;cursor:pointer}
.tart{position:absolute;inset:0;display:block}

@keyframes artin{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1.02)}}
@keyframes artdrift{from{transform:scale(1.02)}to{transform:scale(1.08) translateY(-1%)}}
.tshade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(18,10,36,.25),transparent 22%,transparent 48%,rgba(18,10,36,.55) 70%,rgba(12,6,24,.92)),radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(10,5,20,.45))}

.tlogo{margin:0;line-height:0;width:min(90vw,600px,calc(30dvh * 2.17));transition:width .4s cubic-bezier(.2,.7,.2,1);animation:logoin 1s cubic-bezier(.2,1.4,.4,1) .5s both}
.tlogo img{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 0 rgba(40,8,30,.55)) drop-shadow(0 0 24px rgba(255,170,80,.45));animation:logofloat 3.6s ease-in-out 1.5s infinite}
@keyframes logoin{from{opacity:0;transform:translateY(-30px) scale(1.25)}to{opacity:1;transform:none}}
@keyframes logofloat{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-10px) rotate(.4deg)}}
.t-menu .tlogo{width:min(70vw,420px,calc(20dvh * 2.17))}
.sparks{position:absolute;inset:0;pointer-events:none;z-index:2}
.sparks i{position:absolute;left:var(--x);bottom:-10px;width:4px;height:4px;background:#ffd98a;box-shadow:0 0 8px 2px rgba(255,190,90,.7);animation:spark var(--s) linear var(--d) infinite;opacity:0}

@keyframes spark{0%{transform:translateY(0);opacity:0}10%{opacity:1}80%{opacity:.8}100%{transform:translateY(-100dvh) translateX(30px);opacity:0}}
.tmid{position:relative;display:grid;justify-items:center;gap:4px;width:100%;animation:pop .4s 1.2s both}

.tapstart{border:0;background:none;cursor:pointer;font-family:"Pixelify Sans",var(--f-pixel);font-size:clamp(26px,6vw,44px);font-weight:700;letter-spacing:.14em;color:#fff;

.sets{display:grid;gap:8px}

/* HUD + top tabs (all sizes) */

/* coach guide */

const roundDone=F=>F.over||F.ex>=EX_PER_ROUND;

function useSkill(F,s,id){const o=s===F.A?F.B:F.A;s.skUsed=s.skUsed||{};if(F.over||s.skRound||s.skUsed[id])return null;const sk=fightSkills(s).find(k=>k.id===id);if(!sk)return null;

  if(sk.k==="def")s.burst={k:"def",left:4,pw};

  return {ha:F.A.hp,hb:F.B.hp,sa:F.A.sta,sb:F.B.sta,s:s===F.A?"A":"B",t:`${s.name} ใช้ "${sk.name}"!`,k:"big",ev:"skill",rid:s.f.id,an:s.name,dn:o.name,skn:sk.name,skk:sk.k,w:sk.w};}
function aiSkill(F,s,rng){if(s.skRound||F.over)return null;const L=fightSkills(s).filter(k=>!(s.skUsed&&s.skUsed[k.id]));if(!L.length)return null;
  const o=s===F.A?F.B:F.A,ex=F.ex,last=F.round>=F.rounds;const behind=F.cards.reduce((x,c)=>x+(s===F.A?c[0]-c[1]:c[1]-c[0]),0)<0;

  if(rec&&s.sta<38&&ex>=2)return useSkill(F,s,rec.id);

  if(ex<3)return null;
  const p=(last?.3:.1)+(behind?.12:0)+(F.round>=2?.05:0);
  if(rng()<p){const k=atk||def||rec;return useSkill(F,s,k.id);}
  return null;}

    const ini=s=>{const a=s.f.a,m=s===F.A?mA:mB;return -s.legs/12+a.speed*.3+a.foot*.15+a.iq*.2+a.comp*.1+m.aggr*10+rng()*9+(s.sta-60)/12;};

      log.push({ha:F.A.hp,hb:F.B.hp,sa:F.A.sta,sb:F.B.sta,s:at===F.A?"A":"B",t:`${at.name} ${tx}${crit?" — เข้าเต็ม ๆ!":""}`,k:crit?"big":"hit",ev:"hit",w:wpn,cl:clinch,crit,an:at.name,dn:df.name});
      if(wpn==="elbow"&&q>1.3&&rng()<.25){df.cuts++;log.push({ha:F.A.hp,hb:F.B.hp,sa:F.A.sta,sb:F.B.sta,s:"x",t:`${df.name} โดนศอกแตก เลือดออกที่คิ้ว`,k:"warn",ev:"cut",an:at.name,dn:df.name});
        if(df.cuts>=2&&rng()<.5){F.over=true;F.result={win:at===F.A?"A":"B",type:"TKO (แพทย์สั่งยุติ)",round:F.round};}}

        log.push({ha:F.A.hp,hb:F.B.hp,sa:F.A.sta,sb:F.B.sta,s:at===F.A?"A":"B",t:`${df.name} ล้มลงและลุกไม่ไหว! กรรมการโบกมือยุติการชก`,k:"big",ev:"ko",an:at.name,dn:df.name});}

function quickFight(fa,fb,seed,rounds,tacA){const F=newFight(fa,fb,{seed,rounds});F.A.tac=tacA||aiTac(fa,F.rng);F.B.tac=aiTac(fb,F.rng);

function comLine(e,F,rng){const R=a=>a[Math.floor(rng()*a.length)];const fill=(s,o)=>s.replace(/\{(\w)\}/g,(m,k)=>o[k]??"");
  const o={a:e.an,d:e.dn,w:WNAME[e.w]||""};const h=fightHeat(F);
  const fun=x=>{if(!x)return x;const grp=F.B.f&&F.B.f.grp;if(grp&&CREATURE_COM[grp]&&rng()<.33&&(e.ev==="hit"||e.ev==="miss"||e.ev==="counter"))return fill(R(CREATURE_COM[grp]),{a:F.B.name,d:F.A.name})+" "+x;
    const L=FUN[e.ev==="counter"?"counter":e.ev==="kd"?"kd":e.ev==="miss"?"miss":e.ev==="hit"?"hit":""];if(L&&rng()<(e.ev==="kd"?.5:.16))return x+" "+fill(R(L),o);if(e.ev==="hit"&&rng()<.06)return x+" "+R(FUN.cheer);return x;};
  const hype=x=>{x=fun(x);if(!h||!x)return x;const big=e.crit||e.ev==="kd"||e.ev==="skill"||e.ev==="rage";
    if(rng()>=(big?.8:.1+h*.1))return x;const L=HYPE[Math.min(4,h+(big&&h>=2?1:0))].filter(y=>y!==F.lastHype);const y=R(L);F.lastHype=y;return x+" "+y;};
  return hype(baseLine(e,F,R,fill,o,h));}
function baseLine(e,F,R,fill,o,h){
  if(e.ev==="ko"&&h>=2)return fill(R(KO_HOT),o);
  if(e.ev==="hit"){if(e.crit)return fill(R(COM.crit),o)+" "+fill(R(COM.hit[e.w]),o);return fill(e.cl&&Math.random()<.5?R(COM.clinch):R(COM.hit[e.w]),o);}
  if(e.ev==="miss")return fill(R(COM.miss),o);
  if(e.ev==="counter"){return fill(R(COM.counter),{a:e.an,d:e.dn,w:WNAME[e.w]});}
  if(e.ev==="kd")return fill(R(COM.kd),o)+" "+fill(R(COM.kdUp),o);
  if(e.ev==="ko")return fill(R(COM.ko),o);
  if(e.ev==="cut")return fill(R(COM.cut),o);
  return e.t;}

  {n:"coach",t:"ไฟต์แรกที่ชนะของค่ายในรอบสองปี ปู่ชัยคงยิ้มอยู่ข้างบน"},
  {fx:G=>{add(G,G.flags.firstWin,"bond",5);add(G,G.flags.firstWin,"trust",3);}}]},

 {id:"first_loss",look:"fight",when:G=>!!G.flags.firstLoss,bg:"night",steps:[

  {choice:[

   {t:"ได้ เร่งซ้อมกันเลย",fx:G=>{const id=G.flags.firstLoss;G.F[id].fatigue=Math.min(100,G.F[id].fatigue+10);add(G,id,"trust",-3);add(G,id,"morale",3);G.F[id].plan={preset:"balanced",intensity:"heavy"};},

 {id:"fatigue_warn",look:"train",when:G=>Object.values(G.F).some(f=>f.camp==="player"&&f.fatigue>=72),bg:"camp",steps:[
  {n:"coach",t:G=>{const f=Object.values(G.F).find(f=>f.camp==="player"&&f.fatigue>=72);G.flags.tiredId=f.id;return `${f.name} ล้าสะสมมากแล้ว ถ้าซ้อมหนักต่อ เสี่ยงบาดเจ็บ`;}},
  {n:G=>G.flags.tiredId,f:"happy",t:"ไม่เป็นไรค่ะ ยังไหว! อีกนิดเดียวก็จะเก่งขึ้นแล้ว"},
  {choice:[
   {t:"สั่งพักหนึ่งสัปดาห์",fx:G=>{const f=G.F[G.flags.tiredId];f.plan={preset:"rest",intensity:"normal"};add(G,f.id,"trust",6);},then:[{n:G=>G.flags.tiredId,f:"flustered",t:"…ก็ได้ค่ะ ขอบคุณที่เป็นห่วงนะคะ"}]},
   {t:"เชื่อใจเธอ ซ้อมต่อ",fx:G=>{add(G,G.flags.tiredId,"morale",4);add(G,G.flags.tiredId,"trust",-2);},then:[{n:"coach",t:"…ก็ได้ แต่ถ้าเจ็บขึ้นมา อย่าโทษใครนะ"}]}]}]},

 {id:"qual_result",look:"fight",when:G=>G.week>=21,bg:"ring",steps:[
  {n:"coach",t:G=>{const q=[...G.qual.A,...G.qual.B].filter(id=>G.F[id].camp==="player");

  {n:"kati",f:G=>G.qual.A.includes("kati")?"happy":"sad",t:G=>G.qual.A.includes("kati")?"รอบอำเภอแล้ว! หนูจะเอาให้ถึงจังหวัดเลยค่ะ!":
    "ยังไม่จบค่ะ ไฟต์งานวัดยังหาเงินเข้าค่ายได้ และหนูยังเก่งขึ้นได้อีก ปีหน้าเราจะกลับมา"}]},

 {id:"ploy_river",look:"train",when:G=>G.week>=24&&G.F.ploy.met,bg:"river",steps:[
  {n:"nar",t:"เย็นวันหนึ่งริมแม่น้ำ คุณเห็นพลอยนั่งพันมือใหม่อยู่คนเดียว"},
  {n:"ploy",f:"sad",t:"…ผู้จัดการค่ายศิริชัย มาทำอะไรแถวนี้"},
  {n:"ploy",f:"sad",t:"เจ้าของค่ายเราอยากได้แชมป์จังหวัดปีนี้ให้ได้ ถ้าไม่ได้ เขาจะยุบรุ่นน้องผู้หญิงทั้งหมด ฉันเป็นกัปตัน ฉันแพ้ไม่ได้"},
  {choice:[
   {t:"การแบกทุกคนไว้คนเดียว ไม่ใช่หน้าที่เธอคนเดียวนะ",fx:G=>{add(G,"ploy","bond",9);},then:[{n:"ploy",f:"flustered",t:"…คุณนี่แปลกนะ เป็นคู่แข่งแต่พูดเหมือนเป็นห่วง ขอบคุณ"}]},
   {t:"งั้นบนเวที ค่ายเราจะไม่ออมมือ",fx:G=>{add(G,"ploy","bond",5);add(G,"ploy","trust",4);},then:[{n:"ploy",f:"happy",t:"ดี แบบนี้ฉันชอบ อย่าทำให้ฉันผิดหวังล่ะ"}]}]}]},

 {id:"loykrathong",look:"casual",when:G=>G.week>=26,bg:"fair",steps:[
  {n:"nar",t:"คืนวันเพ็ญเดือนสิบสอง แม่น้ำเต็มไปด้วยกระทงและแสงเทียน ทั้งค่ายหยุดซ้อมหนึ่งคืน"},
  {n:"coach",t:"ไปเถอะ ไปลอยกระทงกัน ขอให้สิ่งไม่ดีลอยไปกับน้ำ ปีนี้ค่ายเราเจอมาเยอะแล้ว"},
  {n:"nar",t:"คุณจะชวนใครไปลอยกระทงด้วย?"},
  {choiceFn:G=>Object.values(G.F).filter(f=>f.canon&&f.met).map(f=>({t:`ชวน${f.name}`,fx:G2=>{add(G2,f.id,"bond",10);G2.flags.lkWith=f.id;},then:LK_LINES[f.id]}))},
  {fx:G=>{for(const f of Object.values(G.F))if(f.camp==="player")add(G,f.id,"morale",6);}}]},

 {id:"fah_night",look:"casual",when:G=>G.week>=30&&G.F.fah.met,bg:"night",steps:[
  {n:"nar",t:"เที่ยงคืน ร้านสะดวกซื้อหน้าสนามมวย ฟ้านั่งกินบะหมี่ถ้วยอยู่คนเดียว ตาแดงนิด ๆ"},
  {n:"fah",f:"sad",t:"อะไร จะมาหัวเราะเยาะเหรอ… ใครบอกว่าฟ้าร้องไห้ ฝุ่นเข้าตาเฉย ๆ"},
  {n:"fah",f:"sad",t:"ทุกคนชอบฟ้าตอนบุกตอนชนะ แต่วันไหนแพ้ ไม่มีใครถามเลยว่าฟ้าเป็นยังไง เป็นได้แค่ 'ตัวบ้าบิ่น' ของค่าย"},
  {choice:[
   {t:"งั้นฉันถาม ตอนนี้เธอเป็นยังไงบ้าง",fx:G=>add(G,"fah","bond",10),then:[{n:"fah",f:"flustered",t:"…บ้าเหรอ ถามตรง ๆ แบบนี้ใครจะตอบได้ …ก็ไม่ค่อยโอเคหรอก ขอบใจนะ"}]},
   {t:"ความบ้าบิ่นของเธอน่ากลัวที่สุดในรุ่นแล้ว",fx:G=>{add(G,"fah","bond",6);add(G,"fah","morale",8);},then:[{n:"fah",f:"happy",t:"ฮ่า! รู้ตัวด้วยเหรอ งั้นระวังไว้เถอะ ไฟต์หน้าฟ้าจะเอาให้ดู"}]}]}]},

 {id:"mali_family",look:"train",when:G=>G.week>=34&&G.F.mali.camp==="player",bg:"camp",steps:[
  {n:"nar",t:"มะลินั่งคุยโทรศัพท์อยู่หลังค่าย เสียงเบาจนแทบไม่ได้ยิน"},
  {n:"mali",f:"sad",t:"…ไม่เป็นไรค่ะแม่ เดี๋ยวหนูหาเงินส่งไปให้ เดือนนี้หนูชกได้หลายไฟต์ จริง ๆ นะ"},
  {n:"mali",f:"happy",t:"อ๊ะ ผู้จัดการ! ไม่มีอะไรค่ะ ฮ่า ๆ เรื่องที่บ้านนิดหน่อยเอง"},

   {t:"ไม่ต้องยิ้มตลอดก็ได้ เหนื่อยก็บอกได้นะ",fx:G=>add(G,"mali","bond",8),then:[{n:"mali",f:"sad",t:"…ฮือ ทำไมพูดแบบนี้ล่ะคะ เดี๋ยวหนูก็ร้องจริงหรอก"}]}]}]},

 {id:"rin_plan",look:"train",when:G=>G.week>=38&&G.F.rin.camp==="player",bg:"camp",steps:[

   {t:"บางครั้งต้องเชื่อสัญชาตญาณตัวเองบ้าง",fx:G=>{add(G,"rin","bond",8);G.F.rin.a.comp=Math.min(20,G.F.rin.a.comp+1);},then:[{n:"rin",f:"flustered",t:"สัญชาตญาณ… ฉันจะลองดูค่ะ ถ้าพลาด คุณรับผิดชอบด้วยนะ (ใจนิ่ง +1)"}]},
   {t:"งั้นวางแผนสำรองไว้สองชั้น",fx:G=>{add(G,"rin","trust",6);G.F.rin.a.iq=Math.min(20,G.F.rin.a.iq+1);},then:[{n:"rin",f:"happy",t:"แผน B… แน่นอนค่ะ ฉันชอบวิธีคิดของคุณ (ไหวพริบ +1)"}]}]}]},

 {id:"final_result",look:"fight",when:G=>G.week>=41,bg:"hall",steps:[
  {n:"nar",t:"ศาลากลางจังหวัดประดับธง ป้ายประกาศรายชื่อสี่คนสุดท้ายของแต่ละรุ่นแขวนอยู่หน้าเวที"},
  {n:"coach",t:G=>{const f=[...(G.semis.A||[]),...(G.semis.B||[])].filter(id=>G.F[id].camp==="player");
    return f.length?`ประกาศผลรอบอำเภอ! ${f.map(id=>G.F[id].name).join(" และ ")} ติดสี่คนสุดท้าย ได้ชกรอบรองชิงสัปดาห์ที่ 44 ชนะอีกไฟต์เดียวก็ได้ชิงแชมป์จังหวัด!`:"รอบอำเภอปีนี้เราไปไม่ถึงสี่คนสุดท้าย… แต่ค่ายที่เคยร้างวันนี้มีชื่ออยู่บนกระดานแล้ว ปีหน้าเราจะมาใหม่";}},
  {n:"coach",t:G=>{const s=d=>{const t=G.semis[d]||[];return t.length===4?`${G.F[t[0]].name} vs ${G.F[t[3]].name} · ${G.F[t[1]].name} vs ${G.F[t[2]].name}`:"—";};return `รองชิงรุ่น A: ${s("A")} · รุ่น B: ${s("B")}`;}},
  {n:"kati",f:G=>(G.semis.A||[]).includes("kati")?"happy":"sad",t:G=>(G.semis.A||[]).includes("kati")?"อีกสองไฟต์ค่ะ… อีกแค่สองไฟต์ หนูจะได้ยืนบนเวทีที่คุณปู่เคยยืน":"หนูยังไม่เก่งพอ… แต่หนูจะดูทุกไฟต์ที่เหลือ แล้วจำไว้ให้หมดค่ะ"}]},
 {id:"semi_result",look:"fight",when:G=>G.week>=45,bg:"hall",steps:[
  {n:"coach",t:G=>{const f=[...G.finalists.A,...G.finalists.B].filter(id=>G.F[id].camp==="player");
    return f.length?`จบรอบรองชิง! ${f.map(id=>G.F[id].name).join(" และ ")} ได้เข้าชิงแชมป์จังหวัด สัปดาห์ที่ 49 ห้ายก!`:"รอบรองชิงจบแล้ว ค่ายเราไปไม่ถึงรอบชิง… แต่เรายังมีงานต้องทำต่อ";}},
  {n:"coach",t:G=>{const s=d=>G.finalists[d].map(id=>G.F[id].name).join(" vs ")||"—";return `คู่ชิงรุ่น A: ${s("A")} · คู่ชิงรุ่น B: ${s("B")}`;}}]},

 {id:"kati_ourcamp",look:"train",when:G=>G.week>=46,bg:"night",steps:[

  {n:"kati",f:"flustered",t:"ตอนนี้มีเสียงคน มีเสียงหัวเราะ มีผู้จัดการ… นี่คือค่ายของพวกเราแล้วนะคะ"},
  {choice:[
   {t:"ใช่ ค่ายของพวกเรา",fx:G=>{add(G,"kati","bond",6);add(G,"kati","morale",8);},then:[{n:"kati",f:"happy",t:"อื้อ! ค่ายของพวกเรา!"}]},
   {t:"และเธอคือหัวใจของค่ายนี้",fx:G=>{add(G,"kati","bond",9);},then:[{n:"kati",f:"flustered",t:"เอ๊ะ… พะ พูดแบบนี้หนูทำตัวไม่ถูกเลยนะคะ"}]}]}]},

 {id:"fah_visit",look:"train",when:G=>G.week>=12&&G.F.fah.met,bg:"camp",steps:[

  {n:"fah",f:"happy",t:"ได้ยินว่าค่ายศิริชัยมีกระสอบใบใหม่แล้วนี่ ขอยืมเวทีซ้อมหน่อยสิ… กับกะทิด้วย"},

  {choice:[
   {t:"ได้ ซ้อมเบา ๆ สามยก ห้ามจริงจัง",fx:G=>{G.F.kati.a.guard=Math.min(20,G.F.kati.a.guard+.5);G.F.kati.a.counter=Math.min(20,G.F.kati.a.counter+.3);add(G,"fah","bond",5);G.F.kati.fatigue=Math.min(100,G.F.kati.fatigue+6);},

   {t:"ไม่ได้ เก็บไว้ชกกันบนเวทีจริง",fx:G=>{add(G,"kati","morale",5);add(G,"fah","bond",2);},then:[{n:"fah",f:"happy",t:"ฮ่า! ขี้หวงนี่ ก็ได้ เจอกันบนเวทีแล้วกัน"}]}]}]},
 {id:"pre_qual",look:"train",when:G=>G.week>=17,bg:"night",steps:[
  {n:"coach",t:G=>{const s=["A","B"].flatMap(d=>standings(G,d).map((r,i)=>({...r,pos:i+1}))).filter(r=>r.f.camp==="player");
    return s.length?`อีกสามสัปดาห์ตัดรอบตำบล ตอนนี้ ${s.map(r=>`${r.f.name} อยู่อันดับ ${r.pos}`).join(", ")} ต้องติดท็อป 4`:"อีกสามสัปดาห์ตัดรอบตำบล ต้องเร่งหาไฟต์แล้ว";}},
  {n:"kati",f:"happy",t:"หนูจะไม่ปล่อยให้หลุดค่ะ! ผู้จัดการ วางแผนให้หนูด้วยนะคะ"},
  {n:"coach",t:"ครูแนะนำว่า ถ้ามีไฟต์ใกล้ ๆ ให้ใช้โปรแกรม 'เตรียมไฟต์' หนึ่งสัปดาห์ก่อนชก และดูคลิปคู่ชกที่หน้าค่าย"}]},
 {id:"new_sign",look:"train",when:G=>G.camp&&G.camp.beauty>=4,bg:"camp",steps:[
  {n:"nar",t:"ป้ายค่ายถูกทาสีใหม่ ตัวอักษร 'ศิริชัย' สีแดงสดอีกครั้ง มีคนแวะถ่ายรูปหน้าค่ายด้วย"},
  {n:"kati",f:"happy",t:"ผู้จัดการ! ดูสิคะ ป้ายค่ายเรากลับมาสวยแล้ว! เหมือนตอนหนูมาที่นี่ครั้งแรกเลย"},
  {n:"coach",t:"ค่ายที่ดูมีชีวิต คนก็อยากมาเรียน (รายได้คอร์สดีขึ้นตามความสวยของค่าย)"},{fx:G=>{G.rep+=.5;}}]},

function pickTalk(f,rng){const pool=TALK[f.id];f.talked=f.talked||[];
  const c=pool.map((_,i)=>i).filter(i=>!f.talked.includes(i));if(!c.length)return null;
  const i=c[Math.floor(rng()*c.length)];f.talked.push(i);return pool[i];}
function freshLine(f,key,arr,rng){f.used=f.used||{};const u=f.used[key]=f.used[key]||[];let c=arr.map((_,i)=>i).filter(i=>!u.includes(i));
  if(!c.length){f.used[key]=[];c=arr.map((_,i)=>i).filter(i=>i!==u[u.length-1]);if(!c.length)c=[0];}
  const i=c[Math.floor(rng()*c.length)];f.used[key].push(i);return arr[i];}
function freshOnce(f,key,arr,rng){f.used=f.used||{};const u=f.used[key]=f.used[key]||[];const c=arr.map((_,i)=>i).filter(i=>!u.includes(i));if(!c.length)return null;const i=c[Math.floor(rng()*c.length)];u.push(i);return arr[i];}

  const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
  const talkStep=(T)=>[{n:id,f:"happy",l:look,t:T.q},{choice:shuffle(T.o).map(([t,sc,rep])=>({t,fx:G2=>{D.score+=sc;
       if(sc>=2){const fact=revealFact(G2,f,T.know);if(fact)D.facts.push(fact);}else if(T.know&&!f.know[T.know])D.missed=true;},
     then:[{n:id,f:sc>=2?"happy":sc<0?"sad":"flustered",l:look,t:rep}]}))}];
  const T1=pickTalk(f,rng);
  let mid;
  if(T1)mid=talkStep(T1);
  else{f.momentIdx=f.momentIdx||0;const M=MOMENTS[id];
    const quiet=[`คุณกับ${f.name}ใช้เวลาด้วยกันแบบไม่ต้องพูดอะไรมาก แค่นั้นก็พอแล้ว`,`${f.name}เล่าเรื่องซ้อมวันนี้ให้ฟังยาวเหยียด คุณฟังจนจบ`,`ระหว่างทางกลับ ${f.name}เดินช้าลงนิดหนึ่ง เหมือนไม่อยากให้วันนี้จบเร็ว`,`${f.name}หัวเราะกับเรื่องเล็ก ๆ ที่คุณเล่า แล้วบอกว่าวันนี้ดีจัง`];
    mid=f.momentIdx<M.length?[{n:"nar",t:M[f.momentIdx++]}]:[{n:"nar",t:freshLine(f,"quiet",quiet,rng)}];D.score+=1;}
  const intro=freshOnce(f,"in_"+act,A.intro,rng),opener=freshOnce(f,"op_"+pref,OPENERS[id][pref],rng);
  const steps=[{n:"nar",bg:A.bg,t:intro||`${A.name}`},...(opener?[{n:id,f:pref==="dislike"?"sad":"happy",l:look,t:opener}]:[]),
    ...mid,...dateTwist(G,f,D,look),
    {inject:G2=>{const gain=Math.max(0,1+Math.round(D.score*.7));const capped=false,b0=f.bond;add(G2,id,"bond",gain);const real=Math.round(f.bond-b0);if(gain>=4)add(G2,id,"morale",4);
      if(act==="spar"){f.a.iq=Math.min(20,f.a.iq+.3);f.a.guard=Math.min(20,f.a.guard+.3);f.fatigue=Math.min(100,f.fatigue+4);}
      const tier=gain>=5?"great":gain>=2?"ok":"meh";
      f.closed=f.closed||{};const firstClose=!f.closed[tier];f.closed[tier]=true;
      const out=[...(firstClose?[{n:id,f:tier==="meh"?"sad":"happy",l:look,t:DATE_CLOSE[tier][id]}]:[]),
        {n:"nar",t:`ความสนิทกับ${f.name} ${(real>=0?"+":"")+real}${pref==="like"?" · เป็นกิจกรรมที่เธอชอบ!":pref==="dislike"?" · ดูเหมือนเธอจะไม่ค่อยชอบที่นี่":""}${D.facts.length?" · ข้อมูลใหม่ในโปรไฟล์: "+D.facts.join(" / "):D.missed?" · ดูเหมือนเธอยังมีเรื่องอยากเล่ามากกว่านี้ ถ้าตอบให้ตรงใจ":""}`}];
      if(typeof hasSignature!=="undefined"&&hasSignature(f)&&!G2.seen["sig_"+id]){G2.seen["sig_"+id]=true;out.push({n:"nar",t:`✦ ความผูกพันปลดล็อกท่าไม้ตายของ${f.name}: "${SIGNATURE[id].name}" — ${SIGNATURE[id].desc}`});}
      if(f.bond>=40&&!G2.seen["b1_"+id]){G2.seen["b1_"+id]=true;out.push(...BOND_EVENTS[id].lv1.map(x=>({l:look,...x})));}
      if(f.bond>=75&&f.trust>=40&&!G2.romance&&!G2.seen["love_"+id]){G2.seen["love_"+id]=true;
        out.push(...LOVE_EVENTS[id].map(x=>({l:"casual",...x})),{choice:[
          {t:"ฉันก็รู้สึกแบบเดียวกัน",fx:G3=>{G3.romance=id;add(G3,id,"morale",15);},then:[{n:id,f:"flustered",l:"casual",t:LOVE_YES[id]}]},
          {t:"ขอบคุณ แต่ฉันอยากเป็นคนที่คอยอยู่ข้าง ๆ แบบนี้ต่อไป",fx:G3=>add(G3,id,"trust",5),then:[{n:id,f:"sad",l:"casual",t:LOVE_NO[id]}]}]});}
      return out;}}];
  return steps;
}

// ---------- ENDINGS ----------
function endingScene(G){
  const pChamp=Object.entries(G.champ).filter(([d,id])=>G.F[id]&&G.F[id].camp==="player").map(([d,id])=>G.F[id]);
  const pFinal=[...G.finalists.A,...G.finalists.B].some(id=>G.F[id].camp==="player");
  const pQual=[...G.qual.A,...G.qual.B].some(id=>G.F[id].camp==="player");
  let key,title,steps=[];
  if(G.ended==="bankrupt"){key="bankrupt";title="ค่ายปิดชั่วคราว";
    steps=[{n:"nar",bg:"camp",t:"เงินในบัญชีติดลบติดต่อกันหลายสัปดาห์ ธนาคารส่งหนังสือยึดที่ดินค่าย"},
      {n:"kati",f:"sad",t:"…ไม่เป็นไรค่ะ หนูจะไปชกงานวัดหาเงินก่อน แล้วสักวันเราจะกลับมาเปิดค่ายนี้ใหม่"},
      {n:"nar",t:"ป้าย 'ศิริชัย' ถูกปลดลง แต่กะทิเก็บมันไว้ใต้เตียง ทุกคืนเธอยังพันมือและซ้อมต่อ"}];}
  else if(pChamp.length){key="champion";title="แชมป์จังหวัด!";
    steps=[{n:"nar",bg:"ring",t:`เสียงกลองดังสนั่นเวที ${pChamp.map(f=>f.name).join(" และ ")} ชูเข็มขัดแชมป์จังหวัด ค่ายมวยศิริชัยกลับมาอยู่บนแผนที่อีกครั้ง`},
      {n:"coach",t:"ปู่ชัย… ท่านเห็นไหม หลานท่านทำได้แล้ว"},
      {n:pChamp[0].id,f:"happy",t:"เราทำได้แล้วค่ะ! ค่ายของพวกเรา!"}];}
  else if(pFinal||pQual){key="growth";title="พลาดแชมป์ แต่ค่ายเติบโต";
    steps=[{n:"nar",bg:"camp",t:"ปีนี้ไม่มีเข็มขัดแชมป์ แต่ชื่อค่ายศิริชัยถูกพูดถึงอีกครั้งในวงการมวยจังหวัด"},
      {n:"kati",f:"happy",t:"ปีหน้าเราจะไปไกลกว่านี้ค่ะ หนูสัญญา"}];}
  else {key="survive";title="รักษาค่ายไว้ได้อย่างยากลำบาก";
    steps=[{n:"nar",bg:"camp",t:"ค่ายยังเปิดอยู่ หนี้ยังไม่หมด ผลงานยังไม่ดี แต่ไฟในค่ายยังไม่ดับ"},
      {n:"kati",f:"happy",t:"ปีแรกมันยากที่สุดค่ะ ปีหน้ามันต้องดีกว่านี้แน่ ๆ"}];}
  if(key!=="bankrupt"&&typeof personalEnding==="function")steps.push(...personalEnding(G));
  if(G.romance&&key!=="bankrupt")steps.push({n:G.romance,f:"flustered",t:{kati:"ปีหน้า… ก็อยู่ด้วยกันแบบนี้นะคะ ทั้งในค่าย และนอกค่าย",mali:"ปีใหม่นี้ หนูจะพาคุณไปบ้านหนูนะคะ แม่อยากเจอ~",
    rin:"ฉันวางแผนปีหน้าไว้แล้วค่ะ มีชื่อคุณอยู่ทุกหน้าเลย",ploy:"ปีหน้าเราก็ยังเป็นคู่แข่ง… และเป็นคนสำคัญของกันและกัน",fah:"ปีหน้าก็ยังต้องเลี้ยงไส้กรอกฟ้าอยู่นะ ตลอดไปเลย!"}[G.romance]});
  steps.push(...season2Hooks(G,key));
  steps.push({n:"nar",t:"— จบเดโมปีแรก · ขอบคุณที่เล่น Muay Thai Moe —"});
  return {key,title,steps};
}

// ---------- NPC tint (hue rotate saturated non-skin pixels) ----------
const TINTS={};
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
// v1.16: extras use their own 5 base sheets; only the outfit/gloves (red or blue) are re-dyed per fighter
const NPC_HUES=[0,215,130,45,280,22,180,330,95,255];
function npcBase(id){const h=hashStr(id);return {base:"npc"+(1+h%5),hue:NPC_HUES[(h>>>5)%NPC_HUES.length],dark:((h>>>9)%7)===0};}
function sheetFor(f){
  if(f.canon)return img(f.id+"_sheet.webp");
  if(f.sprite)return img(f.sprite+"_sheet.webp"); // v1.23: gang, roosters, bulls
  if(TINTS[f.id])return TINTS[f.id];
  const {base,hue,dark}=npcBase(f.id);const src=img(base+"_sheet.webp");if(!src.complete||!src.naturalWidth)return src;
  const c=document.createElement("canvas");c.width=src.naturalWidth;c.height=src.naturalHeight;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(src,0,0);
  try{const d=x.getImageData(0,0,c.width,c.height),p=d.data,th=hue/360;
    for(let i=0;i<p.length;i+=4){if(p[i+3]<10)continue;let r=p[i]/255,g=p[i+1]/255,b=p[i+2]/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let l=(mx+mn)/2;if(mx===mn)continue;
      const dd=mx-mn;let s=l>.5?dd/(2-mx-mn):dd/(mx+mn);let h=mx===r?(g-b)/dd+(g<b?6:0):mx===g?(b-r)/dd+2:(r-g)/dd+4;h/=6;
      const red=(h<.035||h>.93)&&s>.38&&l>.12&&l<.8,blue=h>.53&&h<.74&&s>.25&&l>.1;if(!red&&!blue)continue; // outfit only: skin & hair stay
      h=th;if(dark){s*=.15;l*=.55;}
      const q=l<.5?l*(1+s):l+s-l*s,pp=2*l-q;const fn=t=>{t=(t+1)%1;return t<1/6?pp+(q-pp)*6*t:t<1/2?q:t<2/3?pp+(q-pp)*(2/3-t)*6:pp;};
      p[i]=fn(h+1/3)*255;p[i+1]=fn(h)*255;p[i+2]=fn(h-1/3)*255;}
    x.putImageData(d,0,0);}catch(e){}
  TINTS[f.id]=c;return c;}

// ---------- RADAR (Nen-style hexagon) ----------
const RADAR_AX=[["หมัด",a=>(a.punch*2+a.power)/3],["เตะ",a=>(a.kick*2+a.foot)/3],["เข่า-ศอก",a=>(a.knee+a.elbow+a.clinch)/3],
  ["ป้องกัน",a=>(a.guard+a.counter+a.foot)/3],["ร่างกาย",a=>(a.speed+a.stamina+a.dur+a.power)/4],["จิตใจ",a=>(a.iq+a.comp)/2]];
function radarSVG(f,size=220,prev){
  const c=size/2,R=size*.34,col=f.color||"#e23b4e";const pt=(i,v)=>{const ang=-Math.PI/2+i*Math.PI/3;return [c+Math.cos(ang)*R*v,c+Math.sin(ang)*R*v];};
  const vals=RADAR_AX.map(([,fn])=>clamp(fn(f.a)/20,0,1));
  const ring=k=>RADAR_AX.map((_,i)=>pt(i,k).join(",")).join(" ");
  const poly=vals.map((v,i)=>pt(i,v).join(",")).join(" ");
  const pot=RADAR_AX.map((_,i)=>pt(i,clamp(f.potential/20,0,1)).join(",")).join(" ");
  const labels=RADAR_AX.map(([n,fn],i)=>{const [x,y]=pt(i,1.24);const v=(vals[i]*20).toFixed(1);const dl=prev?fn(f.a)-fn(prev):0;
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" class="rl">${n}</text><text x="${x}" y="${y+13}" text-anchor="middle" class="rv">${v}${dl>=.05?`<tspan class="rup"> +${dl.toFixed(1)}</tspan>`:""}</text>`;}).join("");
  const id="rg"+Math.random().toString(36).slice(2,7);
  return `<svg class="radar" viewBox="0 0 ${size} ${size+10}" role="img" aria-label="กราฟหกเหลี่ยมค่าสถานะของ${f.name}">
   <defs><radialGradient id="${id}"><stop offset="0%" stop-color="${col}" stop-opacity=".25"/><stop offset="100%" stop-color="${col}" stop-opacity=".75"/></radialGradient></defs>
   ${[.25,.5,.75,1].map(k=>`<polygon points="${ring(k)}" class="rgrid"/>`).join("")}
   ${RADAR_AX.map((_,i)=>{const [x,y]=pt(i,1);return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" class="rgrid"/>`;}).join("")}
   <polygon points="${pot}" class="rpot"/>
   ${prev?`<polygon points="${RADAR_AX.map(([,fn],i)=>pt(i,clamp(fn(prev)/20,0,1)).join(",")).join(" ")}" class="rprev"/>`:""}
   <polygon points="${poly}" fill="url(#${id})" stroke="${col}" stroke-width="2.5" class="rshape"/>
   ${vals.map((v,i)=>{const [x,y]=pt(i,v);return `<rect x="${x-3}" y="${y-3}" width="6" height="6" fill="${col}"/>`;}).join("")}
   ${labels}</svg>`;}

function wander(seed,t,box,period){const seg=Math.floor(t/period),ph=(t%period)/period;
  const pt=k=>{const r=mulberry32(seed*7919+k*104729);return [box[0]+r()*(box[2]-box[0]),box[1]+r()*(box[3]-box[1])];};
  const a=pt(seg),b=pt(seg+1),mv=Math.min(1,ph/.6),e=mv*mv*(3-2*mv);
  return {x:a[0]+(b[0]-a[0])*e,y:a[1]+(b[1]-a[1])*e,moving:mv<1&&Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1])>3,flip:b[0]<a[0]};}

const FS={cv:null,ctx:null,bg:null,A:null,B:null,fx:[],shake:0,
  init(cv,bgName,fa,fb){this.cv=cv;this.ctx=cv?cv.getContext("2d"):null;this.bg=img(bgName);
    const mk=(f,side)=>({f,side,x:side==="A"?370:590,base:side==="A"?370:590,anim:"guard",t0:0,flash:0,down:0,ko:false,win:false});
    this.A=mk(fa,"A");this.B=mk(fb,"B");this.fx=[];this.shake=0;},
  attach(cv){if(!cv)return;this.cv=cv;this.ctx=cv.getContext("2d");},
  play(e,now){const at=e.at||(e.ev==="counter"?(e.mside?e.mside:null):null);
    const atk=this[e.side==="A"?"A":"B"],def=this[e.side==="A"?"B":"A"];if(!atk)return;
    const row=e.w==="kick"||e.w==="knee"?"knee":"punch";
    if(e.ev==="hit"||e.ev==="counter"){atk.anim=row;atk.t0=now;def.flash=now;def.anim="guard";this.shake=e.crit?10:5;
      this.fx.push({x:def.x+(def.side==="A"?30:-30),y:290,t0:now,txt:e.crit?"ผัวะ!!":["ปั้ก!","ตุ้บ!","เพี้ยะ!","ผัวะ!"][Math.floor(Math.random()*4)],big:!!e.crit});
      def.x+=def.side==="A"?-14:14;}
    if(e.ev==="miss"){atk.anim=row;atk.t0=now;def.x+=def.side==="A"?-8:8;this.fx.push({x:def.x,y:270,t0:now,txt:"หลบ!",miss:true});}
    if(e.ev==="kd"){def.down=now;this.shake=14;}
    if(e.ev==="ko"){def.ko=true;def.down=now;atk.win=true;atk.anim="win";this.shake=16;}
    if(e.ev==="cut"){this.fx.push({x:def.x,y:250,t0:now,txt:"แตก!",cut:true});}
  },
  render(t){const S=FS;if(!S.cv||!S.cv.isConnected)return;const x=S.ctx,W=S.cv.width,H=S.cv.height;
    x.save();const sh=S.shake;if(sh>.3){x.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);S.shake*=.88;}
    if(S.bg&&S.bg.naturalWidth){const r=S.bg.naturalWidth/S.bg.naturalHeight;const bw=H*r;x.drawImage(S.bg,(W-bw)/2,0,bw,H);}else{x.fillStyle="#221b3d";x.fillRect(0,0,W,H);}
    // approach centre
    if(!S.A||!S.B){x.restore();return;}for(const s of [S.A,S.B]){s.x+=(s.base-s.x)*.08;
      const el=t-s.t0;let row=s.anim,col;
      if((row==="punch"||row==="knee")&&el>520){s.anim=s.win?"win":"guard";row=s.anim;}
      if(row==="punch"||row==="knee")col=Math.min(3,Math.floor(el/130));else col=Math.floor(t/(row==="win"?180:200))%4;
      const foot=H*.8,h=H*.5,flip=s.side==="B";
      // shadow
      x.fillStyle="rgba(0,0,0,.3)";x.beginPath();x.ellipse(s.x,foot,h*.25,h*.04,0,0,7);x.fill();
      x.save();
      if(s.ko||(s.down&&t-s.down<1300)){const k=s.ko?1:Math.max(0,1-Math.max(0,t-s.down-700)/600);x.translate(s.x,foot);x.rotate((flip?1:-1)*Math.PI/2*Math.min(1,(t-s.down)/220)*k);x.translate(-s.x,-foot);}
      x.imageSmoothingEnabled=true;drawFrame(x,sheetFor(s.f),ROW[row],col,s.x,foot,h,flip);
      if(t-s.flash<140){x.globalCompositeOperation="source-atop";}
      x.restore();
      if(t-s.flash<120){x.save();x.globalAlpha=.55;x.globalCompositeOperation="lighter";drawFrame(x,sheetFor(s.f),ROW[row],col,s.x,foot,h,flip);x.restore();}
      if(s.ko){for(let i=0;i<3;i++){const a=t/300+i*2.1;x.fillStyle="#ffe36b";x.fillRect(s.x+Math.cos(a)*30-3+(flip?20:-20),foot-60+Math.sin(a)*8,6,6);}}
    }
    // effects
    S.fx=S.fx.filter(f=>t-f.t0<900);
    for(const f of S.fx){const k=(t-f.t0)/900;x.save();x.globalAlpha=1-k;x.translate(f.x,f.y-40*k);
      if(!f.miss){x.fillStyle=f.cut?"#ff4b5c":"#fff3a6";for(let i=0;i<8;i++){const a=i/8*6.283;x.fillRect(Math.cos(a)*(14+40*k)-3,Math.sin(a)*(14+40*k)-3,6,6);}}

    x.restore();}

function spotPaint(){document.querySelectorAll(".spot-ov").forEach(e=>e.remove());if(UI.spot==null||!G||UI.scene||UI.fight||UI.modal||!document.querySelector(".hud"))return;

  const main=document.querySelector("main");if(main&&main.contains(el)){const r0=el.getBoundingClientRect(),m0=main.getBoundingClientRect();if(r0.bottom>innerHeight-150||r0.top<m0.top)main.scrollTop+=r0.top-m0.top-60;}

// v1.11: retro pixel scrollbars — the page stays put, panels scroll inside themselves
function pxBars(){document.querySelectorAll(".pxbar").forEach(b=>b.remove());
  document.querySelectorAll(".pxscroll").forEach(el=>{if(el.scrollHeight<=el.clientHeight+4)return;const bar=document.createElement("div");bar.className="pxbar";bar.innerHTML="<i></i>";document.body.appendChild(bar);
    let hide=0;const upd=show=>{if(!el.isConnected){bar.remove();return;}const r=el.getBoundingClientRect();const top=Math.max(r.top,0),bot=Math.min(r.bottom,innerHeight);
      bar.style.top=(top+6)+"px";bar.style.height=Math.max(0,bot-top-12)+"px";bar.style.left=(r.right-12)+"px";
      const h=Math.max(.12,el.clientHeight/el.scrollHeight),p=el.scrollTop/Math.max(1,el.scrollHeight-el.clientHeight);
      bar.firstChild.style.height=(h*100)+"%";bar.firstChild.style.top=(p*(1-h)*100)+"%";
      if(show){bar.classList.add("on");clearTimeout(hide);hide=setTimeout(()=>bar.classList.remove("on"),1100);}};
    upd(false);el.addEventListener("scroll",()=>upd(true),{passive:true});});}

  const rv=Object.values(G.F).filter(f=>f.camp==="rival");if(rv.length)N.push(`ค่ายพยัคฆ์ทองส่งนักมวยลงแข่ง ${rv.length} คน เถ้าแก่ประกาศ "ปีนี้แชมป์ต้องเป็นของเรา"`);

const AX_PRESET={"หมัด":"punch","เตะ":"kick","เข่า-ศอก":"knee","ป้องกัน":"defense","ร่างกาย":"cond","จิตใจ":"defense"};
// v1.14: advice follows the engine's real bonuses (prep in fight week, counter preset before it) and picks a safe intensity
function projF(f,p,i){const P=PRESETS[p],I=INTENSITY[i];return clamp(f.fatigue+P.load*I.l*7-(10+G.fac.recovery*5+G.fac.kitchen*2)-(p==="rest"?22:0),0,100);}
function safeInt(f,p,cap){for(const i of ["heavy","normal","light"])if(INTENSITY[i]&&projF(f,p,i)<=cap)return i;return "light";}
function trainAdvice(f){const b=nextBooking(f);const wk=b?b.week-G.week:99;const op=b?G.F[b.b]:null;const W={punch:"หมัด",kick:"เตะ",knee:"เข่า",elbow:"ศอก"};
  if(f.injury)return {p:"rest",i:"light",why:`ยังเจ็บอีก ${f.injury} สัปดาห์ พักก่อน`};
  if(f.fatigue>=52||projF(f,"cond","light")>68)return {p:"rest",i:"light",why:`ล้า ${Math.round(f.fatigue)} แล้ว ฝืนต่อเสี่ยงเจ็บ พักสัปดาห์นี้`};
  if(b&&wk===0)return {p:"prep",i:safeInt(f,"prep",45),why:`ขึ้นชกสัปดาห์นี้ "เตรียมไฟต์" ได้โบนัสความพร้อม${f.counterPrep?" และยังเก็บโบนัสแก้ทางไว้":""}`};
  // v1.19.2: the week before a fight, stepping into the ring fresh matters more than one more hard session
  if(b&&wk===1&&projF(f,"prep","light")>30)return {p:"rest",i:"light",why:`สัปดาห์หน้าขึ้นชกแล้ว ล้า ${Math.round(f.fatigue)} ยังสูง ขึ้นเวทีตอนล้าแรงจะหมดเร็ว พักให้สดก่อน`};
  if(b&&wk<=2){const cp=counterPreset(op),cap=wk===1?30:50;
    if(scouted(op.id))return {p:cp,i:safeInt(f,cp,cap),why:`${op.name}${COUNTER_WHY[cp]} ซ้อม "${PRESETS[cp].name}" ได้โบนัสแก้ทาง แล้วสัปดาห์ชกค่อยเตรียมไฟต์`};
    const [w,p]=weakPick(f);
    return {p,i:safeInt(f,p,cap),why:`ยังไม่รู้ทาง${op.name} ดูเทปก่อนจะซ้อมแก้ทางได้ ระหว่างนี้เสริม${w[0]}`};}
  const [w,p,rot]=weakPick(f);const i=safeInt(f,p,b?58:65);
  // v1.18: no fight close → coach lays out two roads (own style vs patch the hole) and lets the player choose
  const ms=mainStyle(f);if(ms!==p){const si=safeInt(f,ms,b?58:65);
    return {p,i,two:{weak:{p,i,w:w[0],v:w[1],rot},strong:{p:ms,i:si}},why:`ช่วงนี้ไม่มีไฟต์ใกล้ ๆ มีสองทางให้เลือก ตัดสินใจเองนะ`};}
  return {p,i,why:rot?`ฝึก "${PRESETS[f.plan.preset].name}" ติดกันมาหลายสัปดาห์แล้ว เปลี่ยนไปเสริม${w[0]}บ้าง${i==="heavy"?" ยังสดอยู่ ซ้อมหนักได้":""}`:`จุดอ่อนตอนนี้คือ${w[0]} เสริมก่อน${i==="heavy"?" ยังสดอยู่ ซ้อมหนักได้":""}`};}
// v1.17: pick the preset that actually trains the weak spot (knee vs elbow), and rotate after 2 weeks on the same thing
function weakPick(f){const a=f.a;const ax=RADAR_AX.map(([n,fn])=>[n,fn(a)]).sort((x,y)=>x[1]-y[1]);
  const pre=n=>n==="เข่า-ศอก"?((a.knee+a.clinch)/2<=a.elbow?"knee":"elbow"):n==="จิตใจ"?"defense":AX_PRESET[n];
  let k=0;const streak=(f.trainLog||[]).slice(-2);if(streak.length===2&&streak.every(x=>x===pre(ax[0][0])))k=1;
  return [ax[k],pre(ax[k][0]),k===1];}
function planTip(f){const b=nextBooking(f);if(!b||f.injury)return "";const op=G.F[b.b];

// v1.8: warm portraits before they are needed so scenes don't pop in late
const WARMED={};function warm(src){if(!src||WARMED[src])return;const i=new Image();i.src=src;WARMED[src]=i;}
function warmChar(id,look){if(id==="coach"){warm(`${ASSET}coach.webp`);return;}if(!CANON_IDS.includes(id))return;
  (look==="casual"?["happy","flustered","pout"]:["happy","sad","surprised","angry"]).forEach(m=>warm(stand(id,look,m)));}
function warmSteps(steps,look){const walk=list=>(list||[]).forEach(st=>{if(!st)return;const n=typeof st.n==="function"?null:st.n;if(n)warmChar(n,st.l==="casual"?"casual":look==="casual"&&!st.l?"casual":"fight");
  if(st.with)warmChar(st.with,look==="casual"?"casual":"fight");if(st.bg&&BGIMG[st.bg])warm(ASSET+BGIMG[st.bg]);if(st.choice)st.choice.forEach(c=>walk(c.then));});walk(steps);}
const WARMQ=[];let warmBusy=false;
function warmLater(list){WARMQ.push(...list.filter(s=>!WARMED[s]));if(!warmBusy)warmNext();}
function warmNext(){const src=WARMQ.shift();if(!src){warmBusy=false;return;}warmBusy=true;if(WARMED[src]){warmNext();return;}
  const i=new Image();WARMED[src]=i;i.onload=i.onerror=()=>setTimeout(warmNext,60);i.src=src;}
function warmAll(){const L=[];CANON_IDS.forEach(id=>["happy","sad","surprised","angry"].forEach(m=>L.push(stand(id,"fight",m))));
  CANON_IDS.forEach(id=>["happy","flustered","pout"].forEach(m=>L.push(stand(id,"casual",m))));
  Object.values(BGIMG).concat(Object.values(TIER_BG),["gym2.webp","gym3.webp"]).filter(Boolean).forEach(b=>L.push(ASSET+b));warmLater(L);}
function playScene(steps,done,opts={}){warmSteps(steps,opts.look||"fight");if(opts.bg&&BGIMG[opts.bg])warm(ASSET+BGIMG[opts.bg]);UI.scene={steps:[...steps],i:0,done,bg:opts.bg||"night",look:opts.look||"fight",cur:null,cast:[]};sceneNext();}
function sceneNext(){const S=UI.scene;if(!S)return;
  while(S.i<S.steps.length){const st=S.steps[S.i];
    if(st.inject){const more=st.inject(G)||[];S.steps.splice(S.i,1,...more);continue;}
    if(st.bg)S.bg=st.bg;
    if(st.fx&&!st.n&&!st.choice&&!st.choiceFn){st.fx(G);S.i++;continue;}
    if(st.choice||st.choiceFn){S.cur={choice:(st.choice||st.choiceFn(G))};render();return;}
    const n=val(st.n);S.lookOf=S.lookOf||{};
    // v1.8: each character keeps one outfit for the whole scene
    const look=CANON_IDS.includes(n)?(S.lookOf[n]=S.lookOf[n]||(st.l==="train"?"fight":st.l)||S.look):(st.l||S.look);
    S.cur={n,f:val(st.f)||"happy",t:val(st.t),look,who:st.who};
    if(st.show)S.cast=st.show.map(x=>({id:x.id,f:x.f||"happy",look:S.lookOf[x.id]||x.l||look,back:!!x.back}));
    if(n==="coach"){S.cast=[{id:"coach",f:"happy",look}];}           // the coach always stands alone
    else if(CANON_IDS.includes(n)){const w=st.with&&st.with!=="coach"?st.with:null;let cast=S.cast.filter(c=>c.id!==n&&c.id!=="coach");
      if(w){cast=cast.filter(c=>c.id===w);if(!cast.length)cast=[{id:w,f:"happy",look:S.lookOf[w]||look}];}
      else if(cast.length>1)cast=cast.slice(-1);
      cast.push({id:n,f:S.cur.f,look});S.cast=cast.slice(-2);}
    S.i++;render();return;}
  const d=S.done;UI.scene=null;save();render();if(d)d();}
function sceneChoose(k){const S=UI.scene,c=S.cur.choice[k];AU.sfx("ui");if(c.fx)c.fx(G);S.steps.splice(S.i+1,0,...(c.then||[]));S.i++;sceneNext();}
function sceneHTML(){const S=UI.scene,c=S.cur||{};const sp=c.n==="coach"?{name:"ครูแดง",color:"#d98a4a"}:c.n==="npc"?{name:c.who||"",color:"#8fbf6a"}:(SPK[c.n]||{name:""});
  const who=c.n==="me"?esc(G.player.name):c.n==="nar"?"":esc(sp.name||"");

  const cast=S.cast.map((m,i)=>{const active=m.id===spk||(c.choice&&i===S.cast.length-1);const pos=S.cast.length===1?"c":i===0?"l":"r";
    return `<img class="stand ${pos} ${active&&!m.back?"on":"off"}${m.back?" back":""}" src="${m.back?`${ASSET}${m.id}_back.webp`:stand(m.id,m.look,active?moodFor(c.f,m.look,c.t):moodFor(m.f,m.look,""))}" alt="">`;}).join("");
  const tag="";

   <div class="cast ${(S.cast||[]).length>1?"duo":""}">${cast}</div>
   ${c.choice?"":`<button class="vtap" data-act="vnext" aria-label="ไปต่อ"></button>`}
   <div class="vbox px" data-act="${c.choice?"":"vnext"}" style="--c:${sp.color||"var(--gold)"}">
    ${c.choice?`<div class="choices">${c.choice.map((o,i)=>{const t=val(o.t),m=t.match(/^(.*?)\s*\(([^()]*)\)\s*$/);return `<button data-act="vchoose" data-v="${i}">${esc(m?m[1]:t)}${m?`<small class="cfx">${esc(m[2])}</small>`:""}</button>`;}).join("")}</div>`:
     `${who?`<div class="who">${tag}<b>${who}</b></div>`:""}<div class="txt ${c.n==="nar"?"nar":""}">${esc(c.t||"")}</div><div class="nextc">แตะเพื่อไปต่อ ▸</div>`}
   </div><button class="btn sm vskip" data-act="vskip">ข้ามฉาก</button></div>`;}

function pendingEvents(){return EVENTS.filter(e=>e.when&&!G.seen[e.id]&&e.when(G));}
function runEvents(done){const list=pendingEvents();let played=0;
  const step=()=>{const e=list.shift();if(!e||G.ended){done&&done(played);return;}if(G.seen[e.id]||!e.when(G)){step();return;}
    G.seen[e.id]=true;played++;playScene(e.steps,step,{bg:e.bg,look:e.look});};step();}
function weeklyExtra(done){const rng=mulberry32(G.seed+G.week*313);if(typeof questExtra==="function"&&questExtra(done,mulberry32(G.seed+G.week*59)))return;
  const dil=(typeof DILEMMAS!=="undefined"?DILEMMAS:[]).filter(d=>!G.seen[d.id]&&G.week>=d.from&&G.week<=d.to&&d.need(G));
  const sinceD=G.week-(G.lastDilemma||0);
  // v1.21: something happens most weeks — a decision every couple of weeks, chatter or a happening in between
  if(dil.length&&sinceD>=2&&rng()<.62){const d=dil[Math.floor(rng()*dil.length)];G.seen[d.id]=true;G.lastDilemma=G.week;
    playScene([{n:"nar",t:"— เรื่องที่ต้องตัดสินใจ —"},...d.steps],done,{bg:d.bg==="camp"?"gym":d.bg,look:d.look||"train"});return;}
  const chats=CHATTER.filter(c=>!G.seen[c.id]&&c.need(G));const haps=HAPPENINGS.filter(h=>!G.seen[h.id]);
  const chats2=chats.filter(c=>!c.need2||c.need2(G)),haps2=haps.filter(h=>!h.need||h.need(G));
  let pick=null;if(chats2.length&&rng()<.6)pick=chats2[Math.floor(rng()*chats2.length)];else if(haps2.length&&rng()<.7)pick=haps2[Math.floor(rng()*haps2.length)];
  if(!pick){done();return;}G.seen[pick.id]=true;playScene(pick.steps,done,{bg:pick.bg==="camp"?"gym":pick.bg,look:pick.look||"train"});}
function afterWeekFlow(){if(typeof mailWeekly==="function"&&!G.ended)mailWeekly(G);runEvents(played=>{const fin=()=>{if(G.ended){startEnding();return;}
    if(G.levelUps&&G.levelUps.length){const ids=[...new Set(G.levelUps)];G.levelUps=[];AU.sfx("level");UI.modal={type:"levelup",ids};}render();};
    const go=()=>coachBackScene(()=>aftermathScene(()=>tiredScene(()=>rinScene(fin))));if(played)go();else weeklyExtra(go);});}

  G.tiredAt[f.id]=G.week;const ask={kati:"ครูคะ… ขามันหนักไปหมดเลย ขอพักสักสัปดาห์ได้ไหมคะ",mali:"ฮือ… มะลิเตะไม่ขึ้นแล้วอ่ะ ขอนอนยาว ๆ สักอาทิตย์นะ~",rin:"ตัวเลขชีพจรตอนเช้าฉันสูงผิดปกติ… ร่างกายต้องการพักค่ะ"}[f.id]||"ขอพักสักหน่อยได้ไหมคะ";
  playScene([{n:f.id,f:"sad",l:"fight",t:ask},...(coachOn()?[{n:"coach",t:`ล้า ${Math.round(f.fatigue)} แล้ว ฝืนต่อเสี่ยงเจ็บ ครูว่าพักฟื้นสัปดาห์นี้`}]:[]),
    {choice:[{t:"ให้พักฟื้นสัปดาห์นี้",fx:()=>{if(!trLocked(f))f.plan.preset="rest";f.morale=Math.min(100,f.morale+4);},then:[{n:f.id,f:"happy",l:"fight",t:{kati:"ขอบคุณค่ะ! สัปดาห์หน้าหนูจะกลับมาเต็มร้อย",mali:"เย้~ นอนกอดเจ้าโค้ชทั้งวันเลย!",rin:"ขอบคุณค่ะ ฉันจะใช้วันพักทบทวนเทปไปด้วย"}[f.id]||"ขอบคุณค่ะ!"}]},
     {t:"อดทนอีกนิด ไฟต์ใกล้แล้ว",fx:()=>{f.morale=Math.max(0,f.morale-5);},then:[{n:f.id,f:"sad",l:"fight",t:{kati:"…ค่ะ หนูจะพยายาม",mali:"งื้อ… ได้ค่ะ แต่ห้ามดุนะถ้ามะลิช้า",rin:"…รับทราบค่ะ ฉันจะบันทึกไว้ว่าฝืนเพราะอะไร"}[f.id]||"…ค่ะ"}]}]}],()=>{AU.startMusic("hub");save();done();},{bg:"gym",look:"fight"});}

    {n:"nar",t:"คำแนะนำครูกลับมาใช้ได้อีกครั้ง"}],()=>{AU.startMusic("hub");save();done();},{bg:"gym",look:"train"});}

function rinScene(done){const r=G.F.rin;if(!r||r.camp!=="player"||G.week%3!==0||G.rinSeen===G.week){done();return;}G.rinSeen=G.week;const R=roster(G);const W={punch:"หมัด",kick:"เตะ",knee:"เข่า",elbow:"ศอก"};const L=[];
  const nb=G.bookings.filter(b=>G.F[b.a].camp==="player").sort((a,b)=>a.week-b.week)[0];

  const tired=R.filter(f=>f.fatigue>=50);const w=R.map(f=>[f,RADAR_AX.map(([n,fn])=>[n,fn(f.a)]).sort((a,b)=>a[1]-b[1])[0]]).sort((a,b)=>a[1][1]-b[1][1])[0];
  // v1.22.1: rotate whose weakness Rin talks about, and how she says it
  const rf=R[Math.floor(G.week/3)%R.length],rw=RADAR_AX.map(([n,fn])=>[n,fn(rf.a)]).sort((a,b)=>a[1]-b[1]);const rpick=rw[Math.floor(G.week/6)%2]||rw[0];
  const RW=[`รอบนี้ขอพูดถึง${rf.name}ค่ะ ${rpick[0]}ยังต่ำสุดในตัวเธอ ฝึกเพิ่มนิดเดียวก็เห็นผล`,`${rf.name}ยังเปิดช่องที่${rpick[0]}อยู่ค่ะ คู่ชกที่อ่านเกมเป็นจะเล็งตรงนั้น`,`ถ้าให้เลือกจุดเดียวที่ควรแก้ตอนนี้ ฉันเลือก${rpick[0]}ของ${rf.name}ค่ะ`];
  L.push(tired.length?`${tired.map(f=>f.name).join(", ")}ล้าเกินครึ่งแล้ว ให้พักฟื้นสักสัปดาห์ จะกลับมาแรงกว่าเดิม`:RW[Math.floor(G.week/3)%RW.length]);
  const net=weeklyNet(G),wl=weeksLeft();
  L.push(net<0?`เรื่องเงิน: ตอนนี้ขาดทุนสัปดาห์ละ ${fmt(-net)} อีกราว ${wl} สัปดาห์เงินจะหมด รับไฟต์เพิ่ม หรือเลือกกิจกรรมสอนคลาสพิเศษช่วยได้ค่ะ`:G.cash>40000?`เรื่องเงิน: มีเงินเหลือ ${fmt(G.cash)} ลองอัปเกรดค่ายหรือส่งครูแดงไปอบรม ระยะยาวคุ้มกว่าเก็บไว้ค่ะ`:`เรื่องเงิน: ได้กำไรสัปดาห์ละ ${fmt(net)} ยังไหวค่ะ แต่อย่าเพิ่งใช้จ่ายเยอะ`);
  playScene([{n:"rin",f:"happy",l:"casual",t:"ผู้จัดการคะ ฉันสรุปข้อมูลสามสัปดาห์มาให้แล้วค่ะ"},...L.map(t=>({n:"rin",f:"happy",l:"casual",t})),{n:"rin",f:"flustered",l:"casual",t:["…แค่นี้แหละค่ะ ใช้ได้ก็ใช้นะ","จบรายงานค่ะ คำถามเชิญได้ …ไม่มีก็ดีค่ะ","ฉันพิมพ์สรุปไว้บนบอร์ดหน้าห้องซ้อมแล้วนะคะ","ถ้าทำตามนี้ ฉันประเมินว่าเราจะดีขึ้นแน่นอนค่ะ"][Math.floor(G.week/3)%4]}],()=>{AU.startMusic("hub");save();done();},{bg:"gym",look:"casual"});}

// ---------- week flow ----------
function endWeek(){if(UI.scene||UI.fight||UI.montage)return;AU.resume();UI.tipIdx=0;
  weekTrain(G);
  for(const b of G.bookings.filter(b=>b.week===G.week&&b.npc)){const F=quickFight(G.F[b.a],G.F[b.b],G.seed+G.week*97+b.id.length,b.rounds);finishBracket(G,b,F);applyResult(G,F,b);
    G.log.push(`${TIER[b.tier].name} รุ่น ${G.F[b.a].div}: ${G.F[b.a].name} ${F.result.win==="A"?"ชนะ":"แพ้"} ${G.F[b.b].name} (${F.result.type})`);}
  const queue=G.bookings.filter(b=>b.week===G.week&&!b.npc);
  UI.montage={week:G.week,items:roster(G).map(f=>({id:f.id,gains:{...f.gains},xp:f.xpGain||0,preset:f.plan.preset,injury:f.injury})),fights:queue.length,queue};if(SETTINGS.quick){montageDone();return;}render();}

  if(G.ended){startEnding();return;}UI.modal={type:"report",after:afterWeekFlow};render();}

function makeQ(G,kind,fid,tag){const K=QK[kind],t=qTarget(G,fid)+K.lvl,rng=mulberry32((G.seed^(G.week*977))+kind.length*31);const a={};
  for(const [k] of ATTRS)a[k]=clamp(t+(K.tilt[k]||0)+(rng()*1.6-.8),3,19.5);
  const d=t-ovr(a);for(const [k] of ATTRS)a[k]=clamp(a[k]+d,3,19.5);
  const id=`q_${kind}_${tag||G.week}`;const f=baseFighter(id,{name:K.name,full:K.name,div:"X",camp:"quest",color:K.color,potential:t+2,a});
  f.sprite=K.sprite;f.kind=kind;f.grp=K.grp;f.lvl=clamp(Math.round(t-6),1,10);f.fatigue=0;f.morale=70;G.F[id]=f;return id;}

function mountQSprites(){document.querySelectorAll("canvas[data-qsprite]").forEach(cv=>{const x=cv.getContext("2d");const sh=img(cv.dataset.qsprite+"_sheet.webp");
  LOOPS.add(t=>{if(!cv.isConnected)return;x.clearRect(0,0,cv.width,cv.height);const fr=Math.floor(t/200)%4;x.imageSmoothingEnabled=true;drawFrame(x,sh,ROW.guard,fr,cv.width/2,cv.height*.97,cv.height*.95,true);});});startLoops();}

// ---------- news bar: home only, one item at a time, slides through once, then gone ----------
var NEWS={el:null,q:[],i:0,wk:0};
function newsSync(){if(!NEWS)return;const want=G&&!UI.ending&&UI.tab==="home"&&!UI.scene&&!UI.fight&&!UI.montage&&!UI.modal&&UI.spot==null&&UI.newsWeek!==G.week&&!!document.querySelector(".hud");
  if(!want){if(NEWS.el&&G&&UI.tab!=="home"){UI.newsWeek=G.week;}if(NEWS.el){NEWS.el.remove();NEWS.el=null;}return;}
  const hud=document.querySelector(".hud");const top=Math.round(hud.getBoundingClientRect().bottom)+6;
  if(NEWS.el){NEWS.el.style.top=top+"px";return;}
  if(NEWS.wk!==G.week){NEWS.wk=G.week;NEWS.q=newsItems().slice(0,3);NEWS.i=0;}if(!NEWS.q.length||NEWS.i>=NEWS.q.length){UI.newsWeek=G.week;return;}
  const el=document.createElement("div");el.className="newsbar";el.setAttribute("role","status");el.style.top=top+"px";
  el.innerHTML=`<b class="nlab">ข่าวมวย</b><div class="ntrack"><span class="ncr"></span></div><button class="nclose" aria-label="ปิดข่าว">×</button>`;document.body.appendChild(el);NEWS.el=el;
  el.querySelector(".nclose").onclick=()=>{UI.newsWeek=G.week;el.classList.add("out");setTimeout(()=>{el.remove();if(NEWS.el===el)NEWS.el=null;},300);};
  const show=()=>{if(!el.isConnected)return;if(NEWS.i>=NEWS.q.length){UI.newsWeek=G.week;el.classList.add("out");setTimeout(()=>{el.remove();if(NEWS.el===el)NEWS.el=null;},400);return;}
    const sp=el.querySelector(".ncr");const t=NEWS.q[NEWS.i];sp.textContent=t;sp.style.animation="none";void sp.offsetWidth;
    const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;const dur=reduce?4:Math.min(16,Math.max(7,t.length/6));sp.style.animation=reduce?"none":`ncr ${dur}s linear 1 forwards`;
    clearTimeout(NEWS.tm);NEWS.tm=setTimeout(()=>{NEWS.i++;show();},dur*1000);};show();}
